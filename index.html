<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Calculadora de Escalonados HQS Energy</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="app">
    <section class="hero">
      <div class="brand-header">
        <img src="logo-hqs.png" alt="HQS Energy" class="logo" />
        <div>
          <p>Herramienta oficial para vendedores</p>
          <h1>Calculadora de Escalonados HQS Energy</h1>
        </div>
      </div>

      <form id="form" class="panel">
        <label>Pago inicial mensual
          <input id="payment" type="number" step="0.01" value="149.59">
        </label>

        <label>Escalador anual
          <select id="rate">
            <option value="1.99">1.99%</option>
            <option value="2.99">2.99%</option>
          </select>
        </label>

        <label>Término
          <select id="years">
            <option value="15">15 años</option>
            <option value="25" selected>25 años</option>
          </select>
        </label>

        <button>Calcular</button>
      </form>
    </section>

    <section class="cards">
      <div><span>Pago inicial</span><strong id="start"></strong></div>
      <div><span>Pago final</span><strong id="end"></strong></div>
      <div><span>Promedio mensual</span><strong id="avg"></strong></div>
      <div><span>Total estimado</span><strong id="total"></strong></div>
    </section>

    <section class="table-card">
      <h2 id="title"></h2>
      <table>
        <thead>
          <tr>
            <th>Año</th>
            <th>Pago mensual</th>
            <th>Aumento anual</th>
            <th>Total anual</th>
          </tr>
        </thead>
        <tbody id="body"></tbody>
      </table>
    </section>

    <footer>© HQS Energy · Herramienta interna de ventas</footer>
  </main>

  <script src="script.js"></script>
</body>
</html>
